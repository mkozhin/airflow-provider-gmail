name: publish

# Build the sdist/wheel and publish to PyPI on every version tag push.
# The version is derived by setuptools-scm from the git tag, so the tag itself
# must be checked out with full history (fetch-depth: 0).
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm resolves the version from the tag; it needs the tag
          # and full history, otherwise the build gets fallback_version 0.0.0.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build/twine tooling (unconstrained — no Airflow)
        # Publishing only builds and uploads the artifact; Airflow is not needed.
        # Do NOT apply the Airflow 2.9.1 constraints here: twine 6 needs
        # packaging>=24.2 to validate the wheel's PEP 639 Metadata 2.4, while the
        # Airflow constraints pin packaging==24.0 and would break `twine check`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build "twine>=6.1" "packaging>=24.2"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # Protected environment gates the release; configure required reviewers /
    # branch-tag restrictions on the "pypi" environment in repo settings.
    environment:
      name: pypi
      url: https://pypi.org/p/airflow-provider-gmail
    permissions:
      # OIDC token for PyPI Trusted Publishing — no PYPI_API_TOKEN secret.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
